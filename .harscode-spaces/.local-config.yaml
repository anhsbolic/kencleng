# Kencleng Orchestrator v0.1 pilot local runtime configuration.
# Normally local-only. This pilot branch intentionally commits it as public CRTV/history evidence.
# Do not add credentials, private endpoints, usernames, or absolute home-directory paths.

communication_language: Bahasa Indonesia

paths:
  project_root: .
  harscode_workspace_root: ../harscode-workspace

runtime:
  harness: codex-cli

  # Human local container environment.
  # When a workflow or Techplan says "Docker/Compose-capable environment",
  # treat this configured runtime as the local implementation of that
  # capability instead of assuming a Docker CLI must exist.
  container_engine: podman
  compose:
    runner: podman-compose
    up_command: make up-podman
    down_command: make down-podman

  # Verification guidance:
  # - Do not mark Compose/runtime evidence deferred merely because `docker`
  #   or `docker-compose` is absent. Check the configured Podman path first.
  # - Use the repository's executable Makefile targets rather than inventing
  #   equivalent commands when those targets satisfy the check.
  # - For tools such as testcontainers-go that may depend on a Docker-compatible
  #   API/socket, probe the current Podman environment explicitly. Do not assume
  #   compatibility and do not claim the check ran unless it actually ran.
  container_verification:
    prefer_configured_runtime: true
    docker_cli_absence_is_not_runtime_unavailability: true
    testcontainers_compatibility: verify-at-runtime

orchestrator_pairing:
  default_model: gpt-5.6-terra
  escalation_model: gpt-5.6-sol
  escalation_requires_human_approval: true

# Human-owned, Orchestrator-read-only.
# Only the Human may add/remove models or change capabilities, cost_tier,
# or approval_required. The Orchestrator may select from this registry but
# must never mutate it.
#
# cost_tier: low | standard | high
# approval_required: true means explicit Human approval is required
# before that model can be dispatched.
available_models:
  - id: gpt-5.6-luna
    capabilities:
      - general
      - fast
      - routine-coding
    supported_reasoning_efforts:
      - minimal
      - low
      - medium
    cost_tier: low
    approval_required: false

  - id: gpt-5.6-terra
    capabilities:
      - general
      - coding
      - reasoning
      - repository-work
    supported_reasoning_efforts:
      - low
      - medium
      - high
    cost_tier: standard
    approval_required: false

  - id: gpt-5.6-sol
    capabilities:
      - strong-reasoning
      - coding
      - repository-work
      - architecture
      - cross-cutting-analysis
    supported_reasoning_efforts:
      - medium
      - high
      - xhigh
    cost_tier: high
    approval_required: true
