# Keep service lifecycle independent, matching Docker Compose networking.
x-podman:
  in_pod: false

services:
  postgres:
    image: docker.io/library/postgres:16.15-trixie
    environment:
      POSTGRES_USER: kencleng
      POSTGRES_PASSWORD: kencleng
      POSTGRES_DB: kencleng
    volumes:
      - kencleng_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  kencleng_pgdata:
