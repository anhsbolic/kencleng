            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Campaign is not `published` (e.g. already closed by another trigger).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /events:
    post:
      tags:
        - campaign
      summary: Register a promotional Event and link it to one or more campaigns
      description: No curation gate. Owner or Staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '403':
          description: |
            One or more `campaign_ids` don't belong to an organization the current user represents.
          $ref: '#/components/responses/Forbidden'
        '409':
          description: One or more `campaign_ids` are not `published`/`scheduled`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - campaign
      summary: Get event detail
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{organizationId}/events:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - campaign
      summary: List events created for an organization's campaigns
      description: '# INFERRED — not explicitly specified; proposed for the Owner/Staff event management view.'
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'
  /campaigns/{campaignId}/donations:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - donation
      summary: Public donor list for a campaign
      description: |
        Only `status = success` donations are listed. Names are resolved server-side per the `is_anonymous`/empty-`guest_name` rules — `guest_email` is never included in this or any public-facing shape.
      security: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationListResponse'
    post:
      tags:
        - donation
      summary: Submit a donation (guest or registered)
      description: |
        Public endpoint — works with or without an `Authorization` header. If authenticated, `guest_name`/`guest_email` in the body are ignored in favor of the session user's own identity. Requires `Campaign.status = published`; payment settlement is simulated asynchronously (2-5s delay, 5% failure rate) after this call returns with `status = pending`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitDonationRequest'
      responses:
        '201':
          description: |
            Donation accepted (`status = pending`). `status_token` is returned here and, if `guest_email` was provided, also emailed — this is the only response where it appears.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '409':
          description: Campaign is not `published` (e.g. closed between page load and submit).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://kencleng.dev/errors/campaign-not-published
                title: Campaign Not Accepting Donations
                status: 409
                detail: Campaign ini sudah tidak menerima donasi baru.
        '422':
          description: '`amount` below the Rp 5.000 minimum, or invalid `payment_method`.'
          $ref: '#/components/responses/ValidationError'
  /donations/{donationId}/status:
    parameters:
      - name: donationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: token
        in: query
        required: true
        description: '`status_token` returned at submission time. Never expires — read-only, non-destructive lookup.'
        schema:
          type: string
    get:
      tags:
        - donation
      summary: Check a donation's settlement status (token-based, no login required)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '401':
          description: Token missing or doesn't match this donation.
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /account/donations:
    get:
      tags:
        - donation
      summary: The current user's own full donation history
      description: |
        # INFERRED — not explicitly specified in the phase doc, but implied by the Donatur persona having a personal donation record. Includes donations originally made as guest and later claimed (`claimed_at` set).
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDonationListResponse'
  /account/donations/claimable:
    get:
      tags:
        - donation
      summary: List guest donations eligible for claim by the current user
      description: |
        Matches `Donation.guest_email_hash` against the current user's own verified `primary_email`. Requires the user's email to be verified. Only donations where `guest_email` was actually provided can ever appear here.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimableDonationListResponse'
        '403':
          description: Current user's email is not verified.
          $ref: '#/components/responses/Forbidden'
  /account/donations/{donationId}/claim:
    parameters:
      - name: donationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - donation
      summary: Claim a single guest donation
      description: |
        Explicit, one-at-a-time confirmation — no bulk/auto-claim. Sets `donor_user_id` and `claimed_at`; the original `guest_name`/ `guest_email` snapshot is preserved, and past public display is not retroactively changed.
      responses:
        '200':
          description: Claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDonation'
        '403':
          description: Current user's email is not verified, or this donation's `guest_email` doesn't match.
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Already claimed (by this user or, in a rare shared-email edge case, another user).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /campaigns/{campaignId}/report:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - disbursement
      summary: Public campaign report/summary page (permanent archive)
      description: |
        Available for any `status = closed` campaign, indefinitely. Auto-generated numbers plus the optional Owner narrative.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignReportSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Campaign is not yet `closed`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /campaigns/{campaignId}/report-narrative:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - disbursement
      summary: Add or edit the Owner's narrative on the campaign report
      description: |
        Owner-only (not Staff). No curation gate — editable any number of times, any time after `closed`, with no deadline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportNarrativeRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignReportSummary'
        '403':
          description: Current user is not an `owner`-level representative of this campaign's organization.
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Campaign is not yet `closed`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Narrative exceeds 5000 characters.
          $ref: '#/components/responses/ValidationError'
  /campaigns/{campaignId}/disbursement-requests:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - disbursement
      summary: List disbursement request history for a campaign
      description: Includes past rejected requests as history, not just the currently-active one.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementRequestListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - disbursement
      summary: Request disbursement of collected funds
      description: |
        Owner-only. No request body — `requested_amount` is always set to `Campaign.collected_amount` at the time of request (lump-sum, single-shot model). Requires `Campaign.status = closed` and no other active (`pending`/`approved`/`disbursed`) request for this campaign.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementRequest'
        '403':
          description: Current user is not an `owner`-level representative.
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Campaign is not `closed`, or an active request already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                not_closed:
                  value:
                    type: https://kencleng.dev/errors/campaign-not-closed
                    title: Campaign Not Closed
                    status: 409
                    detail: Campaign harus berstatus closed untuk mengajukan pencairan.
                already_active:
                  value:
                    type: https://kencleng.dev/errors/disbursement-already-active
                    title: Disbursement Request Already Active
                    status: 409
                    detail: Sudah ada request pencairan aktif untuk campaign ini.
  /disbursement-requests:
    get:
      tags:
        - disbursement
      summary: List disbursement requests awaiting Admin decision
      description: Admin-only queue. Filters to `status = pending` by default.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DisbursementRequestStatus'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementRequestListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /disbursement-requests/{disbursementRequestId}:
    parameters:
      - name: disbursementRequestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - disbursement
      summary: Get disbursement request detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /disbursement-requests/{disbursementRequestId}/decision:
    parameters:
      - name: disbursementRequestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - disbursement
      summary: Approve or reject a disbursement request (Admin only)
      description: |
        On approval, simulated fund transfer is triggered internally (short delay) — `status → disbursed` happens as a follow-up system transition, not synchronously in this response. This endpoint's response reflects `status = approved` immediately after an approve decision; poll `GET /disbursement-requests/{id}` to observe the subsequent `disbursed` transition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisbursementDecisionRequest'
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Request is not `pending`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`decision_note` missing while `decision = rejected`.'
          $ref: '#/components/responses/ValidationError'
  /disbursement-requests/{disbursementRequestId}/fund-usage-reports:
    parameters:
      - name: disbursementRequestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - disbursement
      summary: List fund-usage report history for a disbursement
      description: Includes past rejected reports as history, per the resubmit cycle.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundUsageReportListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - disbursement
      summary: Submit a fund-usage report
      description: |
        Owner-only. Requires `DisbursementRequest.status = disbursed`. Sum of `items[].amount` must exactly match `requested_amount` (strict reconciliation — no tolerance; legitimate incidental costs like bank transfer fees must be included as their own line item). On successful submit, clears the organization's `has_overdue_report` flag if it was set, in the same transaction. File attachments are added afterward via the per-item attachment endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFundUsageReportRequest'
      responses:
        '201':
          description: Created (`status = pending_verification`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundUsageReport'
        '403':
          description: Current user is not an `owner`-level representative.
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Disbursement is not yet `disbursed`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Items don't sum to exactly `requested_amount`, or validation failure on a field.
          $ref: '#/components/responses/ValidationError'
  /fund-usage-reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - disbursement
      summary: Get fund-usage report detail (with items and attachment metadata)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundUsageReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /fund-usage-reports/{reportId}/items/{itemId}/attachments:
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - disbursement
      summary: Upload a supporting attachment (nota/foto/dokumen) for a report line item
      description: Private bucket, PDF/JPG/PNG, max 5 MB. Owner-only. Multiple attachments per item are allowed — call this repeatedly.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFundUsageAttachmentRequest'
      responses:
        '201':
          description: Uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundUsageReportItemAttachment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Invalid file type or exceeds 5 MB max.
          $ref: '#/components/responses/ValidationError'
  /fund-usage-reports/curation-queue:
    get:
      tags:
        - disbursement
      summary: List fund-usage reports awaiting curator assignment (Admin only)
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundUsageReportListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /fund-usage-reports/{reportId}/curation/assign:
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - disbursement
      summary: Assign a Kurator to verify this fund-usage report (Admin only)
      description: Fails if the chosen kurator is a representative of the report's organization (conflict of interest).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCuratorRequest'
      responses:
        '201':
          description: Assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundUsageReportVerificationAssignment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict of interest, or an active assignment already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /fund-usage-reports/curation-assignments/mine:
    get:
      tags:
        - disbursement
      summary: List the current Kurator's assigned fund-usage-report verification items
      parameters:
        - name: decision
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CurationDecision'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundUsageReportVerificationAssignmentListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /fund-usage-reports/{reportId}/curation/decision:
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - disbursement
      summary: Submit a verification decision (approve/reject) — assigned Kurator only
      description: |
        Rejecting here does **not** re-trigger `has_overdue_report` — that flag is purely about submission timing (Fitur 4), not verification outcome. Organization may be rejected and resubmit any number of times penalty-free, as long as the original submission was on time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurationDecisionRequest'
      responses:
        '200':
          description: Decision recorded. `status → verified` or `rejected`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundUsageReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: No active (`pending`) assignment exists for this report.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`decision_note` missing while `decision = rejected`.'
          $ref: '#/components/responses/ValidationError'
  /notifications:
    get:
      tags:
        - notification
      summary: List the current user's notifications
      description: |
        Always filtered server-side to `expires_at > now()` (soft-hide) — expired notifications never appear here even before the weekly hard-delete worker physically removes them.
      parameters:
        - name: unread_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
  /notifications/unread-count:
    get:
      tags:
        - notification
      summary: Get the current user's unread notification count
      description: Backs the persistent header badge.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
  /notifications/mark-read:
    post:
      tags:
        - notification
      summary: Batch mark notifications as read
      description: |
        Idempotent — re-marking an already-read notification (e.g. from a retried batch) is a no-op, guarded by `WHERE read_at IS NULL` per row server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationsReadRequest'
      responses:
        '204':
          description: Marked as read.
        '422':
          description: Neither `notification_ids` nor `all` provided, or both provided together.
components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: Length-only policy (NIST 800-63B style) — no character-class requirement.
    GenericAcceptedMessage:
      type: object
      description: |
        Deliberately generic response shape — used anywhere a distinct message would leak user enumeration (forgot-password, resend verification).
      properties:
        message:
          type: string
          example: Kalau email terdaftar, instruksi sudah dikirim.
    Problem:
      type: object
      description: RFC 9457 Problem Details base shape.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          example: https://kencleng.dev/errors/validation-failed
        title:
          type: string
          example: Validation Failed
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: One or more fields failed validation.
        instance:
          type: string
          format: uri
          description: Optional — path of the request that produced this error.
    ValidationProblem:
      description: Problem Details extended with per-field validation errors.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                    example: password
                  message:
                    type: string
                    example: Password ditemukan di daftar breach publik, silakan pilih password lain.
    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    Role:
      type: string
      enum:
        - admin
        - kurator
    ProviderType:
      type: string
      enum:
        - email_password
        - google
      description: '`phone_otp` is modeled in the DB but not exposed via API in v1.'
    User:
      type: object
      description: |
        The authenticated user's own profile. Full detail (including decrypted `email`) is only ever returned for the resource owner — any FE-side display of *other* users' PII (e.g. Admin viewing a user list) goes through the `MaskedField` component, masking is a frontend concern per kencleng-actors-entities.md.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
          description: True if at least one `email_password` AuthIdentity has `verified_at` set.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        auth_providers:
          type: array
          description: Which identity providers this user has linked.
          items:
            $ref: '#/components/schemas/ProviderType'
        mfa_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
