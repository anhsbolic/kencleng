openapi: 3.0.3
info:
  title: Kencleng API
  version: 0.1.0-draft
  description: |
    API contract for Kencleng, a sandbox donation-platform learning project.

    ## Conventions (apply to every domain)

    - **Success responses are unwrapped** — the resource is returned directly
      in the response body. The only exception is **list endpoints**, which
      wrap results as `{ data: [...], pagination: {...} }`.
    - **Errors follow RFC 9457 (Problem Details for HTTP APIs)**
      (`application/problem+json`). Validation errors extend the base
      Problem shape with an `errors[]` field for per-field messages.
    - **Pagination is cursor-based**, using the UUIDv7 primary key of the
      resource directly as the cursor (no separate composite cursor needed,
      since UUIDv7 is already time-orderable).
    - **Auth**: Bearer JWT (ES256) access token in the `Authorization`
      header for protected endpoints. The refresh token is never sent as a
      bearer token — it travels only as an `HttpOnly` + `Secure` +
      `SameSite=Strict` cookie, set/read implicitly by
      `/auth/login`, `/auth/refresh`, and `/auth/logout`. Because it's
      cookie-based, it is documented in each affected endpoint's
      `description` rather than as a formal `securityScheme`.

    ## Status of this document

    All 6 domains complete: **account, organization, campaign, donation,
    disbursement, notification**. This covers the full v1 business-rule
    surface documented in `kencleng-phase0-detail.md` through
    `kencleng-phase3-detail.md`. Endpoint shapes not explicitly specified
    in those docs (which intentionally exclude endpoint-level detail) were
    inferred while authoring this spec and are marked `# INFERRED` in
    comments throughout — these are proposals, not settled decisions,
    until reviewed and confirmed.
servers:
  - url: /api
    description: Same-origin, reverse-proxied (see kencleng-backend-tech-stack.md deployment topology)
security:
  - bearerAuth: []
tags:
  - name: account
    description: |
      Registration, login/session management, MFA, multi-provider identity linking, and role assignment. Corresponds to `internal/domain/account/`.
  - name: organization
    description: |
      Organization registration, legal-document attachments, representative management, and the Kurasi Organization (verification) workflow. Corresponds to `internal/domain/organizations/`. Does **not** cover campaigns, curation of campaigns, or events — those belong to the `campaign` domain (next in the generation sequence).
  - name: campaign
    description: |
      Campaign registration, media attachments, Kurasi Campaign, publish/ schedule/unpublish/republish, closure (auto + force-close), and lightweight promotional Events. Corresponds to `internal/domain/campaign/`. Includes the one deliberate composite endpoint (`GET /campaigns/{campaignId}`) that aggregates campaign + organization + progress data, per the design philosophy agreed in `kencleng-backend-tech-stack.md`.
  - name: donation
    description: |
      Donation submission (guest + registered), simulated payment settlement, public progress/donor-list display, and the guest donation claim flow. Corresponds to `internal/domain/donation/`. Automatic campaign closure triggers (`max_amount`/`deadline`) are internal side effects of this domain's transaction path, not separate endpoints — see `campaign` domain for the Admin-facing `force-close` endpoint.
  - name: disbursement
    description: |
      Post-campaign reporting narrative, disbursement requests + Admin approval, simulated fund transfer, fund-usage report submission, and its Kurator verification workflow. Corresponds to `internal/domain/disbursement/`.
  - name: notification
    description: |
      Notification center — reading and batched mark-as-read. Corresponds to `internal/domain/notification/`. Notifications themselves are created internally by every other domain (organization, campaign, donation, disbursement) as a side effect of their own actions — there is no cross-domain "create notification" endpoint; this tag only covers the recipient-facing read path.
paths:
  /auth/register:
    post:
      tags:
        - account
      summary: Register a new account (email_password)
      description: |
        Anti-enumeration [RESOLVED — 2026-08-05]: response is always `202` with the same generic message, regardless of whether the email is new, already registered-unverified, already registered-verified, or already claimed by a `google`-only account (see docs/spec/account/features/01-register-email-verification.md). The actual email sent differs by case (verification link / resend-verification nudge / password-reset nudge / "this email uses Google login" nudge), but the API response and response time must not reveal which case occurred.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: |
            Always returned regardless of the email's actual state in the system — see the anti-enumeration note above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcceptedMessage'
              example:
                message: Kalau email belum terdaftar, cek inbox untuk verifikasi. Kalau sudah, cek inbox untuk instruksi lebih lanjut.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verify-email:
    post:
      tags:
        - account
      summary: Verify email using the token from the verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email berhasil diverifikasi.
        '404':
          description: Token not found / already used (also covers a token revoked by a later resend — `revoked_at IS NOT NULL`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Token expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://kencleng.dev/errors/token-expired
                title: Token Expired
                status: 410
                detail: Link verifikasi sudah kedaluwarsa. Silakan minta kirim ulang.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verify-email/resend:
    post:
      tags:
        - account
      summary: Resend the verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202':
          description: |
            Always returns this generic acceptance, regardless of whether the email is registered/unverified (anti user-enumeration is not strictly required here since this endpoint doesn't reveal registration status either way, but kept generic for consistency).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcceptedMessage'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags:
        - account
      summary: Login with email_password
      description: |
        On success with no MFA enrolled, sets the refresh token as an HttpOnly cookie and returns `LoginResponse`. If MFA is enrolled, returns `LoginMfaRequiredResponse` instead (no cookie set yet) — complete via `POST /auth/login/mfa`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded, or MFA verification required.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/LoginMfaRequiredResponse'
              examples:
                no_mfa:
                  summary: Login succeeded (no MFA)
                  value:
                    status: ok
                    access_token: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9...
                    access_token_expires_at: '2026-07-25T10:15:00Z'
                    user:
                      id: 01930f2e-7f1a-7c3a-9b1e-2f6a1c8e4d10
                      name: Anhar
                      email: anhar@example.com
                      email_verified: true
                      roles: []
                      auth_providers:
                        - email_password
                      mfa_enabled: false
                      created_at: '2026-01-01T00:00:00Z'
                mfa_required:
                  summary: MFA verification required
                  value:
                    status: mfa_required
                    mfa_pending_token: eyJhbGciOiJIUzI1NiJ9...
        '401':
          description: Invalid credentials. Same message whether the account is locked or the password is simply wrong (anti-enumeration).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://kencleng.dev/errors/invalid-credentials
                title: Invalid Credentials
                status: 401
                detail: Email atau password salah.
        '429':
          $ref: '#/components/responses/LockedOutGenericCredentials'
  /auth/login/mfa:
    post:
      tags:
        - account
      summary: Complete login by submitting a TOTP or backup code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMfaRequest'
      responses:
        '200':
          description: MFA verified, login complete. Refresh token cookie set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid TOTP/backup code, or expired/invalid `mfa_pending_token`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/LockedOutGenericCredentials'
  /auth/refresh:
    post:
      tags:
        - account
      summary: Rotate the refresh token and issue a new access token
      description: |
        Reads the refresh token from the `HttpOnly` cookie (not from the request body). On reuse detection (a rotated-out token used again), the entire token family is revoked and this endpoint returns 401 — client must force a full re-login.
      security: []
      responses:
        '200':
          description: New access token issued, refresh token cookie rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Refresh token missing, expired, revoked, or reuse detected.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      tags:
        - account
      summary: Revoke the current refresh token and clear the session cookie
      responses:
        '204':
          description: Logged out.
  /auth/forgot-password:
    post:
      tags:
        - account
      summary: Request a password reset link
      description: |
        Always returns 202 with the same generic message, regardless of whether the email is registered, unregistered, or registered as Google-only (anti user-enumeration). For Google-only accounts, a distinct notice email is sent instead of a reset link — but the API response is identical either way.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Generic acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcceptedMessage'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/reset-password:
    post:
      tags:
        - account
      summary: Reset password using a token from the reset email
      description: On success, all of the user's existing refresh tokens are revoked (force logout everywhere).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset, all sessions revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password berhasil diubah. Silakan login ulang.
        '404':
          description: Token not found / already used.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Token expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Password fails policy or found in breach-list.
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/google/redirect:
    get:
      tags:
        - account
      summary: Initiate the Google OAuth flow
      description: |
        # INFERRED — one shared redirect-initiation endpoint for login/register/link/reauth, distinguished by `intent`. Not a JSON endpoint — issues a 302 to Google's consent screen and sets `state`+`nonce` in a short-TTL HttpOnly cookie (~10 min). `intent=link` and `intent=reauth` require an existing authenticated session (still validated via the access token, sent as normal);  `intent=login`/`register` do not.
      security: []
      parameters:
        - name: intent
          in: query
          required: true
          schema:
            type: string
            enum:
              - login
              - link
              - reauth
      responses:
        '302':
          description: Redirect to Google's OAuth consent screen.
  /auth/google/callback:
    get:
      tags:
        - account
      summary: Google OAuth callback
      description: |
        Validates `state`+`nonce` against the cookie set by `/auth/google/redirect`, exchanges the authorization code, verifies the `id_token` against Google's JWKS. Behavior branches on the `intent` carried through `state`:
          - `login`: existing `google` AuthIdentity → issue tokens (302 to app, cookie set).
          - `login` + no existing identity + email not used by `email_password` → create User, issue tokens.
          - `login` + email already used by `email_password` → 302 to `/login` with an error query param (no auto-merge).
          - `link`: attach a new `google` AuthIdentity to the current session's user.
          - `reauth`: used only to satisfy an MFA-disable re-authentication requirement for Google-only users; does not issue new tokens.
        Not a JSON endpoint from the browser's perspective — always ends in a redirect to a frontend route (success or error state indicated via query param).
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the frontend (final destination on success, or an error-state route on failure).
  /account/security/google/unlink:
    post:
      tags:
        - account
      summary: Unlink the Google identity from the current account
      description: |
        Requires re-authentication (`password`) [RESOLVED — 2026-08-05]. Blocked (409) in two distinct cases — see the two examples below: (1) `google` is the only identity at all (INV-account-02), or (2) another identity exists but isn't verified yet (INV-account-12) — distinguished so the user knows whether to *start* set-password or just *finish* verifying an email they already started.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlinkGoogleRequest'
      responses:
        '200':
          description: Unlinked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlinkGoogleResponse'
        '401':
          description: Incorrect `password`.
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Google is the only identity, or the remaining identity isn't verified yet — see the two examples.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                only_identity:
                  summary: No other identity exists at all (INV-account-02)
                  value:
                    type: https://kencleng.dev/errors/only-identity
                    title: Cannot Unlink Only Identity
                    status: 409
                    detail: Google adalah satu-satunya metode login Anda. Atur email dan password dulu sebelum melepas tautan.
                unverified_identity:
                  summary: Another identity exists but isn't verified yet (INV-account-12)
                  value:
                    type: https://kencleng.dev/errors/unverified-remaining-identity
                    title: Remaining Identity Not Verified
                    status: 409
                    detail: Kamu sudah atur email dan password, tapi belum diverifikasi. Verifikasi email kamu dulu sebelum bisa melepas tautan Google.
  /account/me:
    get:
      tags:
        - account
      summary: Get the current authenticated user's profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /account/security/set-password:
    post:
      tags:
        - account
      summary: Add an email_password identity, or change the existing one
      description: |
        See `SetPasswordRequest`'s description for the two branches. Branch 1 (add new identity, Google-only caller): follows the same anti-enumeration pattern as `/auth/register` — response is generic `202` whether or not the submitted `email` is already claimed by someone else (a distinct nudge email is sent instead, no new identity/token created). Branch 2 (change existing password): immediate `200`, wrong `current_password` is `401`, not generic (this branch is not enumeration- sensitive — the caller is already authenticated and acting on their own known identity).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '200':
          description: |
            Branch 2 only — password changed immediately, all existing sessions revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password berhasil diganti. Semua sesi lain telah keluar otomatis.
        '202':
          description: |
            Branch 1 only — always returned regardless of whether the submitted email was actually available (anti-enumeration, same pattern as POST /auth/register).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcceptedMessage'
              example:
                message: Kalau email tersedia, cek inbox untuk verifikasi.
        '401':
          description: Branch 2 only — incorrect `current_password`.
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /account/security/mfa/enroll:
    post:
      tags:
        - account
      summary: Start TOTP MFA enrollment
      description: |
        Generates a new TOTP secret (not yet enabled until confirmed). Rejected with 409 if MFA is already enabled — re-enrollment must go through disable → enable, never a stray re-enroll over a live secret.
      responses:
        '200':
          description: Secret generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollResponse'
        '409':
          description: MFA is already enabled; re-enrollment rejected.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://kencleng.dev/errors/mfa-already-enabled
                title: MFA Already Enabled
                status: 409
                detail: MFA sudah aktif. Nonaktifkan dulu sebelum mendaftar ulang.
  /account/security/mfa/enroll/confirm:
    post:
      tags:
        - account
      summary: Confirm MFA enrollment with a TOTP code
      description: On success, MFA becomes active and 10 backup codes are generated and returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollConfirmRequest'
      responses:
        '200':
          description: MFA enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollConfirmResponse'
        '422':
          description: Invalid TOTP code.
          $ref: '#/components/responses/ValidationError'
  /account/security/mfa/disable:
    post:
      tags:
        - account
      summary: Disable MFA (requires re-authentication)
      description: |
        For `email_password` users, submit `password` in the body. For Google-only users, re-authenticate first via `GET /auth/google/redirect?intent=reauth`, then call this endpoint with no body (the reauth is validated via a short-lived server-side marker tied to the session — implementation detail).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
      responses:
        '200':
          description: MFA disabled, backup codes invalidated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: MFA berhasil dinonaktifkan.
        '401':
          description: Re-authentication failed or missing.
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Missing `password` for an `email_password` caller.
          $ref: '#/components/responses/ValidationError'
  /admin/users:
    get:
      tags:
        - account
      summary: List users (Admin only)
      description: |
        Used by the Admin "kelola user" page for role assignment. Admin-only authz is checked explicitly at the handler level, not only via a query filter (see AGENTS.md golden rules).
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/AdminUsersLimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{userId}/roles:
    post:
      tags:
        - account
      summary: Assign a role (admin or kurator) to a user
      description: |
        Rejected with 409 if assigning `admin` to a user who currently holds `kurator` or is an organization representative (mutual exclusivity rule, INV-account-09/10), or if the target already holds the requested role (INV-account-09's duplicate- assignment case, added 2026-08-05 — see docs/spec/account/features/08-role-assignment.md Assumption A).
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '201':
          description: Role assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Role conflict — see the three examples (exclusivity or duplicate assignment).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                admin_kurator_conflict:
                  summary: Target already holds the other exclusive role (INV-account-09)
                  value:
                    type: https://kencleng.dev/errors/role-conflict
                    title: Role Conflict
                    status: 409
                    detail: User ini sudah menjadi Kurator. Lepas role Kurator dulu sebelum jadi Admin.
                representative_conflict:
                  summary: Target is an organization representative (INV-account-10)
                  value:
                    type: https://kencleng.dev/errors/role-conflict
                    title: Role Conflict
                    status: 409
                    detail: User ini masih menjadi representative organisasi. Lepas dari organisasi dulu sebelum jadi Admin.
                duplicate_assignment:
                  summary: Target already holds the requested role
                  value:
                    type: https://kencleng.dev/errors/duplicate-role
                    title: Role Already Assigned
                    status: 409
                    detail: User ini sudah punya role ini.
    delete:
      tags:
        - account
      summary: Revoke a role from a user
      description: |
        Rejected with 409 in two cases, added 2026-08-05 [RESOLVED] — see docs/spec/account/features/08-role-assignment.md: (1) revoking `admin` from the last remaining Admin in the system (INV-account-13), or (2) revoking `kurator` from a user who has a `pending` row in `organization_curation_assignments` (INV-account-14, cross-domain read against a table `organization` owns).
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '204':
          description: Role revoked.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Last-Admin guard, or pending-curation-assignment guard — see the two examples.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                last_admin:
                  summary: Target is the last remaining Admin (INV-account-13)
                  value:
                    type: https://kencleng.dev/errors/last-admin
                    title: Cannot Revoke Last Admin
                    status: 409
                    detail: Tidak bisa melepas role Admin dari satu-satunya Admin yang tersisa di sistem.
                pending_curation:
                  summary: Target has a pending curation assignment (INV-account-14)
                  value:
                    type: https://kencleng.dev/errors/pending-curation-assignment
                    title: Kurator Has Pending Assignment
                    status: 409
                    detail: User ini masih punya tugas kurasi yang pending. Selesaikan atau alihkan dulu sebelum melepas role Kurator.
  /organizations:
    get:
      tags:
        - organization
      summary: List organization the current user represents
      description: |
        # INFERRED — scope defaults to "mine" (organization where the current user has any OrganizationRepresentative row). Admin/Kurator-wide listing (e.g. for a curation dashboard) is served separately by `/organizations/curation-queue`, not by widening this endpoint's scope.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
    post:
      tags:
        - organization
      summary: Register a new organization
      description: |
        Creates the organization (`status = pending_verification`) and the registrant's own representative record (`level = owner`) in one transaction. Rejected if the current user already represents 5 organization as owner, or currently holds the Admin role.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Current user holds the Admin role (mutually exclusive with representing an organization).
          $ref: '#/components/responses/Forbidden'
        '409':
          description: NPWP already registered to another organization, or the user already represents 5 organization as owner.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                npwp_taken:
                  value:
                    type: https://kencleng.dev/errors/npwp-taken
                    title: NPWP Already Registered
                    status: 409
                    detail: NPWP ini sudah terdaftar di organisasi lain.
                org_limit:
                  value:
                    type: https://kencleng.dev/errors/organization-limit-reached
                    title: Organization Limit Reached
                    status: 409
                    detail: Anda sudah menjadi owner di 5 organisasi, batas maksimum tercapai.
        '422':
          $ref: '#/components/responses/ValidationError'
  /organizations/{organizationId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - organization
      summary: Get organization detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - organization
      summary: Update organization fields
      description: |
        Updating `name` or `npwp` (legal/identitas class) requires `confirm: true` and sends `status` back to `pending_verification`, opening a new curation cycle. `description`/`contact` (operasional class) never require confirmation and never change `status`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Current user is not a representative of this organization.
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`name`/`npwp` changed without `confirm: true`, or NPWP already taken.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://kencleng.dev/errors/confirmation-required
                title: Confirmation Required
                status: 409
                detail: Mengubah field legal/identitas memerlukan konfirmasi eksplisit (confirm=true).
        '422':
          $ref: '#/components/responses/ValidationError'
  /organizations/{organizationId}/attachments:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - organization
      summary: List legal document attachments
      description: Returns metadata only — use the signed-URL endpoint to actually view/download a file.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationAttachment'
        '403':
          description: |
            Only Owner-level representatives, or Admin/Kurator, may list legal documents (per kencleng-phase0-detail.md Fitur 7 — legal docs restricted to `owner`, not `staff`).
          $ref: '#/components/responses/Forbidden'
  /organizations/{organizationId}/attachments/{type}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AttachmentType'
    put:
      tags:
        - organization
      summary: Upload or replace a legal document
      description: |
        Replacing `akta_notaris` or `sk_kemenkumham` triggers re-curation (same as editing `name`/`npwp`) and requires `confirm=true`. Replacing `izin_pub` does not.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReplaceAttachmentRequest'
      responses:
        '200':
          description: Uploaded/replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAttachment'
        '403':
          description: Only `owner`-level representatives may manage legal documents.
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Legal-document replacement submitted without `confirm=true`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid file type or exceeds 5 MB max.
          $ref: '#/components/responses/ValidationError'
    get:
      tags:
        - organization
      summary: Get a signed download URL for a legal document
      responses:
        '200':
          description: OK — `download_url` valid for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAttachment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{organizationId}/representatives:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - organization
      summary: List representatives
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Representative'
    post:
      tags:
        - organization
      summary: Invite a representative (direct-add, no consent step)
      description: |
        Adds `level = staff` immediately. Fails if the email doesn't belong to a registered, email-verified user, or is already a representative of this organization. Owner-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRepresentativeRequest'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Representative'
        '403':
          description: Current user is not an `owner`-level representative of this organization.
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No registered, email-verified user found for that email.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://kencleng.dev/errors/user-not-found
                title: User Not Found
                status: 404
                detail: User harus terdaftar & email terverifikasi dulu.
        '409':
          description: Already a representative of this organization.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /organizations/{organizationId}/representatives/{representativeId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: representativeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - organization
      summary: Promote (staff → owner) or demote (owner → staff) a representative
      description: |
        Demoting the last remaining `owner` is rejected (409) — an organization must always retain at least one owner. Owner-only, including for self-demote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRepresentativeLevelRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Representative'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Would leave the organization with 0 owners.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://kencleng.dev/errors/last-owner
                title: Cannot Demote Last Owner
                status: 409
                detail: Organisasi harus memiliki minimal satu owner.
    delete:
      tags:
        - organization
      summary: Remove a representative
      description: |
        Removing the last remaining `owner` is rejected (409), same guard as demote. Owner-only, including for self-remove.
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Would leave the organization with 0 owners.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
