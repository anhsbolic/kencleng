        token:
          type: string
        new_password:
          type: string
          format: password
          minLength: 8
    UnlinkGoogleRequest:
      type: object
      description: |
        Re-authentication payload, added 2026-08-05 [RESOLVED] — see docs/spec/account/features/05-account-linking.md. Always possible to satisfy by the time unlink can succeed at all, since INV-account-12 guarantees a verified `email_password` identity exists at that point (the identity being removed is always the `google` one).
      required:
        - password
      properties:
        password:
          type: string
          format: password
          description: The caller's current email_password password, confirming this action is really them.
    UnlinkGoogleResponse:
      type: object
      properties:
        message:
          type: string
          example: Akun Google berhasil dilepas.
    SetPasswordRequest:
      type: object
      description: |
        Redesigned 2026-08-05 [RESOLVED] — this endpoint now branches server-side into two behaviors depending on the caller's existing identities, not on which fields are sent (see docs/spec/account/features/05-account-linking.md).
        Branch 1 (caller has no `email_password` identity yet — Google-only): requires `email` + `password`. Creates a new, unverified `email_password` identity; must be verified via `POST /auth/verify-email` before it's usable. Response `202`.
        Branch 2 (caller already has an `email_password` identity — change password): requires `current_password` + `password`. Updates the existing identity's credential in place, takes effect immediately, force-revokes all existing sessions. Response `200`.
      required:
        - password
      properties:
        email:
          type: string
          format: email
          description: Branch 1 only. New email for the identity being added — not necessarily the account's existing `primary_email` (e.g. migrating from a personal Gmail-linked account to a work email).
        current_password:
          type: string
          format: password
          description: Branch 2 only. Confirms ownership of the existing identity before changing its password — prevents a hijacked-but-still-valid session from silently taking over the account.
        password:
          type: string
          format: password
          minLength: 8
          description: New password, both branches. Length-only policy (NIST 800-63B style), same as registration.
