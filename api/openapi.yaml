            $ref: '#/components/schemas/MyDonation'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ClaimableDonation:
      type: object
      description: |
        Candidate donation shown to a registered, email-verified user on the "Klaim Donasi Lama" page — matched by `guest_email_hash`. This is the one place `guest_email` is returned in full, since it's being matched against the requesting user's own verified email.
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        campaign_title:
          type: string
        guest_name:
          type: string
          nullable: true
        guest_email:
          type: string
          format: email
        amount:
          type: string
          example: '50000.00'
        created_at:
          type: string
          format: date-time
    ClaimableDonationListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClaimableDonation'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CampaignReportSummary:
      type: object
      description: Public, permanent archive page — auto-generated numbers plus optional Owner narrative.
      properties:
        campaign_id:
          type: string
          format: uuid
        collected_amount:
          type: string
          example: '12500000.00'
        unique_donor_count:
          type: integer
        duration_days:
          type: integer
        closed_reason:
          $ref: '#/components/schemas/ClosedReason'
        report_narrative:
          type: string
          nullable: true
          description: Raw Markdown, max 5000 chars. Frontend is responsible for sanitized rendering (never `dangerouslySetInnerHTML` on unsanitized output).
    UpdateReportNarrativeRequest:
      type: object
      required:
        - report_narrative
      properties:
        report_narrative:
          type: string
          maxLength: 5000
          description: Raw Markdown. May be set to an empty string to clear it. Owner-only, editable any time, no curation gate.
    DisbursementRequestStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - disbursed
    DisbursementRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid
        requested_amount:
          type: string
          description: Always equals `Campaign.collected_amount` at request time (lump-sum, single-shot model).
          example: '12500000.00'
        status:
          $ref: '#/components/schemas/DisbursementRequestStatus'
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        decision_note:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        disbursed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    DisbursementRequestListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DisbursementRequest'
        pagination:
          $ref: '#/components/schemas/Pagination'
    DisbursementDecisionRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - approved
            - rejected
        decision_note:
          type: string
          description: Required if `decision` is `rejected`.
    FundUsageReportStatus:
      type: string
      enum:
        - pending_verification
        - verified
        - rejected
    FundUsageReportItemAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        original_name:
          type: string
        size_bytes:
          type: integer
        content_type:
          type: string
        uploaded_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        download_url:
          type: string
          description: Signed URL, 5-minute expiry — private bucket.
    FundUsageReportItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        amount:
          type: string
          example: '500000.00'
        description:
          type: string
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/FundUsageReportItemAttachment'
        created_at:
          type: string
          format: date-time
    FundUsageReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        disbursement_request_id:
          type: string
          format: uuid
        submitted_by:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/FundUsageReportStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FundUsageReportItem'
        submitted_at:
          type: string
          format: date-time
    FundUsageReportListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FundUsageReport'
        pagination:
          $ref: '#/components/schemas/Pagination'
    FundUsageReportItemCreate:
      type: object
      required:
        - category
        - amount
      properties:
        category:
          type: string
          description: Free-text expense category (e.g. "Biaya administrasi bank"), not a fixed enum.
        amount:
          type: string
          example: '500000.00'
        description:
          type: string
    CreateFundUsageReportRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FundUsageReportItemCreate'
          description: Sum of all `amount` values must exactly equal the disbursement's `requested_amount` (strict reconciliation, no tolerance).
    UploadFundUsageAttachmentRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
    FundUsageReportVerificationAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fund_usage_report_id:
          type: string
          format: uuid
        kurator_id:
          type: string
          format: uuid
        assigned_by:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time
        decision:
          $ref: '#/components/schemas/CurationDecision'
        decision_note:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
    FundUsageReportVerificationAssignmentListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FundUsageReportVerificationAssignment'
        pagination:
          $ref: '#/components/schemas/Pagination'
    NotificationType:
      type: string
      description: |
        Extensible list — per kencleng-phase0-detail.md Fitur 6, adding a new notification type is just a new string value using the same mechanism, not a new endpoint. Enumerated here for FE type-safety; update this enum whenever a new type is introduced elsewhere in the spec.
      enum:
        - organization_verified
        - organization_rejected
        - campaign_approved
        - campaign_rejected
        - campaign_closed
        - donation_success
        - disbursement_completed
        - admin_new_curation_item
        - kurator_assigned
        - fund_usage_report_verified
        - fund_usage_report_rejected
        - disbursement_approved
        - disbursement_rejected
        - forgot_password_google_only_notice
    NotificationChannel:
      type: string
      enum:
        - in_app
        - email
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        payload:
          type: object
          additionalProperties: true
          description: Free-form JSON, shape depends on `type` (e.g. campaign id/title for campaign-related types).
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    NotificationListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'
    UnreadCountResponse:
      type: object
      required:
        - unread_count
      properties:
        unread_count:
          type: integer
    MarkNotificationsReadRequest:
      type: object
      description: |
        Batched, not per-notification — per kencleng-phase0-detail.md Fitur 6, client-side interactions are debounced/batched into one request rather than firing per click.
      properties:
        notification_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
          description: |
            Mutually exclusive with `all`. Capped at 50 (matches LimitParam's max page size) — see docs/spec/notification/threat-model.md and docs/spec/notification/features/04-batched-mark-as-read.md for rationale [RESOLVED — 2026-08-19].
        all:
          type: boolean
          description: Mark every currently-unread notification as read. Mutually exclusive with `notification_ids`.
  responses:
    ValidationError:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    TooManyRequests:
      description: Rate limit or lockout threshold exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://kencleng.dev/errors/too-many-requests
            title: Too Many Requests
            status: 429
            detail: Terlalu banyak percobaan gagal. Coba lagi dalam 15 menit.
    LockedOutGenericCredentials:
      description: |
        Locked out (>=5 failed attempts / 15 min window) — deliberately returns the same generic title/detail as the 401 case above, per anti-enumeration business rule; only the status code differs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://kencleng.dev/errors/too-many-requests
            title: Invalid Credentials
            status: 429
            detail: Email atau password salah.
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://kencleng.dev/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: Access token tidak valid atau sudah kedaluwarsa.
    Forbidden:
      description: Authenticated, but not permitted to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://kencleng.dev/errors/forbidden
            title: Forbidden
            status: 403
            detail: Anda tidak memiliki izin untuk melakukan aksi ini.
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque cursor (a resource UUIDv7) from a previous page's `pagination.next_cursor`. Omit for the first page.
      schema:
        type: string
        format: uuid
    AdminUsersLimitParam:
      name: limit
      in: query
      required: false
      description: |
        Max items per page. Default 20, max 20 — hard-capped lower than the general LimitParam [RESOLVED — 2026-08-05, see docs/spec/account/threat-model.md component 6] because every row requires a decrypt operation (this endpoint bulk-exposes PII), unlike most other paginated list endpoints.
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 20
    LimitParam:
      name: limit
      in: query
      required: false
      description: Max items per page. Default 20, max 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID, unique per submission attempt. Prevents a double-click / retry from creating two Donation records for the same intended submission — see kencleng-phase2-detail.md Fitur 1.
      schema:
        type: string
        format: uuid
