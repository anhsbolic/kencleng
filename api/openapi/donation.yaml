paths:
  # ===========================================================================
  # Slice 2 reconciliation covers guest submit/status; other historical paths remain untouched here.
  # ===========================================================================

  /campaigns/{campaignId}/donations:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [donation]
      summary: Public donor list for a campaign
      description: >
        Only `status = success` donations are listed. Names are resolved
        server-side per the `is_anonymous`/empty-`guest_name` rules —
        `guest_email` is never included in this or any public-facing shape.
      security: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/CursorParam"
        - $ref: "./common.yaml#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationListResponse"

    post:
      tags: [donation]
      summary: Submit a guest donation for QRIS sandbox simulation
      description: >
        Guest submission does not require an Account. A new submission is
        accepted only when it wins the atomic ordering against Campaign
        closure while the Campaign is eligible; otherwise it is rejected.
        The submitted amount must not exceed the Campaign's effective
        max_donation_amount. Admission also requires the full amount to fit
        within settled Funding plus accepted-pending reservations and the
        Campaign's finite funding capacity. An otherwise eligible amount
        that does not fit returns the shared generic 422 ValidationError on
        amount, even if a smaller valid amount could fit. This capacity
        predicate remains distinct from individual cap validation and the
        response does not disclose remaining capacity or the close reason.
        Closed/ineligible submissions continue to use 409, and retrying with
        the same Idempotency-Key and payload returns the original donation;
        reuse with a different payload remains a conflict.
        If authoritative settled Funding is unavailable, the request fails
        closed with a generic 503 Problem and no Donation is admitted. No
        internal reason or Retry-After header is returned.
        An accepted donation is persisted as `pending`. The backend-owned
        sandbox simulator may later set `success` or `failed`; this request
        cannot select a terminal outcome. QRIS is the only accepted payment
        method and means sandbox simulation only, not external settlement.
        No simulator timing is promised. Pending donations are not
        automatically resubmitted. A deliberate new donation after failure
        uses a new idempotency key.

        A retry with the same `Idempotency-Key` and same payload returns the
        original donation; reuse with a different payload is rejected. This
        request idempotency contract is separate from settlement replay and
        exact-once funding. A donation accepted while eligible remains
        settleable for its full amount after Campaign closure. Successful
        settlement and the full funding increment are one atomic, exactly-once
        outcome; later settlement does not reopen the Campaign or change its
        winning close reason. Funding may exceed the closure threshold.

        If a guest opts in to status email, the address must be verified
        before any status/access message. At most one status-only,
        simulation-labeled notice is eligible at terminal `success` or
        `failed`, never initial `pending`. A verified address remains eligible
        until that notice is fulfilled. Delivery must make terminalization
        bounded and recoverable; its bound and mechanics remain owner-defined.
        Verification, retry, retention, and deletion controls remain open.
      security: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDonationRequest"
      responses:
        "201":
          description: Donation accepted as `pending`; includes a temporary guest status credential for frontend handoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "422":
          $ref: "./common.yaml#/components/responses/ValidationError"
        "409":
          description: Campaign is ineligible or the idempotency key was reused with a different payload.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"
              example:
                type: "https://kencleng.dev/errors/campaign-not-published"
                title: "Campaign Not Accepting Donations"
                status: 409
                detail: "Campaign ini sudah tidak menerima donasi baru."
        "503":
          description: Authoritative settled Funding is unavailable; the request fails closed and no Donation is admitted. No internal reason or Retry-After header is returned.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /donations/{donationId}/status:
    parameters:
      - name: donationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Donation-Status-Credential
        in: header
        required: false
        description: >
          Guest status bearer credential. The frontend receives it from the
          submission response, places it in the status URL fragment, reads it
          during the status-page handoff, removes it from the visible URL,
          then sends it in this header. It is optional on the wire so a missing
          credential can receive the same `404` as other invalid lookups.
        schema:
          type: string
    get:
      tags: [donation]
      summary: Check temporary guest donation status
      description: >
        The status credential is a difficult-to-guess bearer credential. Its
        verifier is stored as a one-way HMAC and it expires exactly 24 hours
        after issuance without extension. The response contains status only.
        The frontend obtains the credential from the URL fragment, hands it
        to this request in `X-Donation-Status-Credential`, and cleans the
        visible URL. Credential generation, key handling, comparison,
        expiration enforcement, browser/referrer/log/cache protections, and
        abuse controls require separate owner decisions and evidence.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationStatusResponse"
        "404":
          description: >
            Uniform result for an absent donation, or a missing, incorrect,
            or expired credential. These cases use the same status, Problem
            Details body, response headers, and cache behavior. Runtime parity
            remains to be demonstrated.
          headers:
            Cache-Control:
              description: Prevents storage of credential lookup failures.
              schema:
                type: string
                enum: ["private, no-store"]
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"
              example:
                type: "https://kencleng.dev/errors/donation-status-not-found"
                title: "Donation Status Not Found"
                status: 404
                detail: "Status donasi tidak tersedia."

  /account/donations:
    get:
      tags: [donation]
      summary: The current user's own full donation history
      description: >
        # INFERRED — not explicitly specified in the phase doc, but
        implied by the Donatur persona having a personal donation record.
        Includes donations originally made as guest and later claimed
        (`claimed_at` set).
      parameters:
        - $ref: "./common.yaml#/components/parameters/CursorParam"
        - $ref: "./common.yaml#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyDonationListResponse"

  /account/donations/claimable:
    get:
      tags: [donation]
      summary: List guest donations eligible for claim by the current user
      description: >
        Matches `Donation.guest_email_hash` against the current user's own
        verified `primary_email`. Requires the user's email to be
        verified. Only donations where `guest_email` was actually provided
        can ever appear here.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimableDonationListResponse"
        "403":
          description: Current user's email is not verified.
          $ref: "./common.yaml#/components/responses/Forbidden"

  /account/donations/{donationId}/claim:
    parameters:
      - name: donationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [donation]
      summary: Claim a single guest donation
      description: >
        Explicit, one-at-a-time confirmation — no bulk/auto-claim. Sets
        `donor_user_id` and `claimed_at`; the original `guest_name`/
        `guest_email` snapshot is preserved, and past public display is
        not retroactively changed.
      responses:
        "200":
          description: Claimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyDonation"
        "403":
          description: Current user's email is not verified, or this donation's `guest_email` doesn't match.
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: Already claimed (by this user or, in a rare shared-email edge case, another user).
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"


components:
  schemas:
    # Donation domain schemas
    # ---------------------------------------------------------------------
    PaymentMethod:
      type: string
      description: >
        QRIS is the only accepted method for the Slice 2 sandbox simulation.
        GoPay, ShopeePay, and bank transfer may be displayed as unavailable
        UI choices but are not valid submission values. No real payment rail
        is active.
      enum: [qris]

    DonationStatus:
      type: string
      enum: [pending, success, failed]

    DonationStatusResponse:
      type: object
      description: Deliberately status-only guest projection.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/DonationStatus"

    SubmitDonationRequest:
      type: object
      required: [amount, currency_code, payment_method]
      properties:
        amount:
          type: string
          pattern: '^(?:[5-9][0-9]{3}|[1-9][0-9]{4,})$'
          description: >
            Major-unit decimal string paired with currency_code. Calculation
            and persistence preserve exact decimal values end-to-end without
            float/float64 conversion. For Slice 2 IDR input, this is a whole
            Rupiah amount of at least 5000 with one-Rupiah increments; 5001
            is valid. No maximum, fractional rule for other currencies, or
            storage precision is set here.
          example: "50000"
        currency_code:
          type: string
          description: Explicit ISO currency code paired with amount; Slice 2 submissions use IDR.
          enum: [IDR]
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        guest_name:
          type: string
          nullable: true
          description: Optional guest name; not public by default.
        guest_email:
          type: string
          format: email
          nullable: true
          description: >
            Optional guest address used only for donation-status notices after
            ownership verification. It is not public and is not used for
            campaign-wide updates. O3 controls for verification, retention,
            retry, and deletion remain owner-defined.
        guest_email_status_opt_in:
          type: boolean
          default: false
          description: >
            Explicit opt-in for status-only email. When true, guest_email is
            required. The approved disclosure is: “Verifikasi email dalam 24
            jam sejak alamat dicatat. Jika tidak diverifikasi, alamat dihapus
            dan pemberitahuan tidak dikirim. Donasi tetap berjalan.” No notice
            or access link is sent before ownership verification or for initial
            pending. At most one terminal status-only notice is eligible at
            success/failed and is labeled “Hasil simulasi donasi:
            berhasil/gagal.” A verified address remains eligible until that
            notice is fulfilled under bounded, recoverable terminalization;
            its bound and implementation remain open.
        is_anonymous:
          type: boolean
          default: false
        event_id:
          type: string
          format: uuid
          nullable: true
          description: Optional — set if the donation was made in the context of a specific Event.

    Donation:
      type: object
      required: [id, campaign_id, amount, currency_code, payment_method, status, status_token, created_at]
      description: >
        Submission result. The temporary credential is returned only here
        for frontend handoff to a fragment-carried status URL; it is never
        returned by the status lookup. Guest email is not included.
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          nullable: true
        amount:
          type: string
          example: "50000"
        currency_code:
          type: string
          description: Explicit currency code paired with amount.
          example: IDR
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        is_anonymous:
          type: boolean
        status:
          $ref: "#/components/schemas/DonationStatus"
        guest_name:
          type: string
          nullable: true
        status_token:
          type: string
          description: >
            Difficult-to-guess bearer credential returned only in this
            submission response. The frontend hands it off through the URL
            fragment and removes it from the visible URL. The verifier is
            one-way HMAC and the credential expires 24 hours after issuance.
            Concrete generation/strength evidence and implementation
            controls remain open; no numeric entropy/length is specified.
        created_at:
          type: string
          format: date-time

    DonationListItem:
      type: object
      description: Public donor-list projection — the only shape ever exposed to unauthenticated/public listing.
      required: [amount, currency_code]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
          description: >
            Server-computed: the donor's name (registered) or `guest_name`,
            substituted with a generic label if empty, or `null` entirely
            if `is_anonymous = true`. Exact generic-label copy is a FE
            concern per kencleng-phase2-detail.md.
        amount:
          type: string
          example: "50000"
        currency_code:
          type: string
          example: IDR
        created_at:
          type: string
          format: date-time

    DonationListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DonationListItem"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    ClaimableDonation:
      type: object
      description: >
        Candidate donation shown to a registered, email-verified user on
        the "Klaim Donasi Lama" page — matched by `guest_email_hash`. This
        is the one place `guest_email` is returned in full, since it's
        being matched against the requesting user's own verified email.
      required: [amount, currency_code]
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        campaign_title:
          type: string
        guest_name:
          type: string
          nullable: true
        guest_email:
          type: string
          format: email
        amount:
          type: string
          example: "50000"
        currency_code:
          type: string
          example: IDR
        created_at:
          type: string
          format: date-time

    ClaimableDonationListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClaimableDonation"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    MyDonation:
      type: object
      description: A registered user's own full donation history (including claimed guest donations).
      required: [amount, currency_code]
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        campaign_title:
          type: string
        amount:
          type: string
          example: "50000"
        currency_code:
          type: string
          example: IDR
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        is_anonymous:
          type: boolean
        status:
          $ref: "#/components/schemas/DonationStatus"
        claimed_at:
          type: string
          format: date-time
          nullable: true
          description: Set if this donation was originally a guest donation later claimed.
        created_at:
          type: string
          format: date-time

    MyDonationListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MyDonation"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    # ---------------------------------------------------------------------
