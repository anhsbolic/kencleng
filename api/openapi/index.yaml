openapi: 3.0.3

info:
  title: Kencleng API
  version: 0.1.0-draft
  description: |
    API contract for Kencleng, a sandbox donation-platform learning project.

    ## Conventions (apply to every domain)

    - **Success responses are unwrapped** — the resource is returned directly
      in the response body. The only exception is **list endpoints**, which
      wrap results as `{ data: [...], pagination: {...} }`.
    - **Errors follow RFC 9457 (Problem Details for HTTP APIs)**
      (`application/problem+json`). Validation errors extend the base
      Problem shape with an `errors[]` field for per-field messages.
    - **Pagination is cursor-based**, using the UUIDv7 primary key of the
      resource directly as the cursor (no separate composite cursor needed,
      since UUIDv7 is already time-orderable).
    - **Auth**: Bearer JWT (ES256) access token in the `Authorization`
      header for protected endpoints. The refresh token is never sent as a
      bearer token — it travels only as an `HttpOnly` + `Secure` +
      `SameSite=Strict` cookie, set/read implicitly by
      `/auth/login`, `/auth/refresh`, and `/auth/logout`. Because it's
      cookie-based, it is documented in each affected endpoint's
      `description` rather than as a formal `securityScheme`.

    ## Status of this document

    All 6 domains complete: **account, organization, campaign, donation,
    disbursement, notification**. This covers the full v1 business-rule
    surface documented in `kencleng-phase0-detail.md` through
    `kencleng-phase3-detail.md`. Endpoint shapes not explicitly specified
    in those docs (which intentionally exclude endpoint-level detail) were
    inferred while authoring this spec and are marked `# INFERRED` in
    comments throughout — these are proposals, not settled decisions,
    until reviewed and confirmed.

servers:
  - url: /api
    description: Same-origin, reverse-proxied (see kencleng-backend-tech-stack.md deployment topology)

tags:
  - name: account
    description: >
      Registration, login/session management, MFA, multi-provider identity
      linking, and role assignment. Corresponds to `internal/domain/account/`.
  - name: organization
    description: >
      Organization registration, legal-document attachments, representative
      management, and the Kurasi Organization (verification) workflow.
      Corresponds to `internal/domain/organizations/`. Does **not** cover
      campaigns, curation of campaigns, or events — those belong to the
      `campaign` domain (next in the generation sequence).
  - name: campaign
    description: >
      Campaign registration, media attachments, Kurasi Campaign, publish/
      schedule/unpublish/republish, closure (auto + force-close), and
      lightweight promotional Events. Corresponds to
      `internal/domain/campaign/`. Includes the one deliberate composite
      endpoint (`GET /campaigns/{campaignId}`) that aggregates campaign +
      organization + progress data, per the design philosophy agreed in
      `kencleng-backend-tech-stack.md`.
  - name: donation
    description: >
      Donation submission (guest + registered), simulated payment
      settlement, public progress/donor-list display, and the guest
      donation claim flow. Corresponds to `internal/domain/donation/`.
      Automatic campaign closure triggers (`max_amount`/`deadline`) are
      internal side effects of this domain's transaction path, not
      separate endpoints — see `campaign` domain for the Admin-facing
      `force-close` endpoint.
  - name: disbursement
    description: >
      Post-campaign reporting narrative, disbursement requests + Admin
      approval, simulated fund transfer, fund-usage report submission,
      and its Kurator verification workflow. Corresponds to
      `internal/domain/disbursement/`.
  - name: notification
    description: >
      Notification center — reading and batched mark-as-read. Corresponds
      to `internal/domain/notification/`. Notifications themselves are
      created internally by every other domain (organization, campaign,
      donation, disbursement) as a side effect of their own actions —
      there is no cross-domain "create notification" endpoint; this tag
      only covers the recipient-facing read path.

