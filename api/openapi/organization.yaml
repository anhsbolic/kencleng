paths:
  # ===========================================================================
  # Organization domain (Fitur 1, 1B, 2 of kencleng-phase1-detail.md)
  # ===========================================================================

  /organizations:
    get:
      tags: [organization]
      summary: List organization the current user represents
      description: >
        # INFERRED — scope defaults to "mine" (organization where the current
        user has any OrganizationRepresentative row). Admin/Kurator-wide
        listing (e.g. for a curation dashboard) is served separately by
        `/organizations/curation-queue`, not by widening this endpoint's scope.
      parameters:
        - $ref: "./common.yaml#/components/parameters/CursorParam"
        - $ref: "./common.yaml#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"

    post:
      tags: [organization]
      summary: Register a new organization
      description: >
        Creates the organization (`status = pending_verification`) and the
        registrant's own representative record (`level = owner`) in one
        transaction. Rejected if the current user already represents 5
        organization as owner, or currently holds the Admin role.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/OrganizationCreateRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "422":
          $ref: "./common.yaml#/components/responses/ValidationError"
        "403":
          description: Current user holds the Admin role (mutually exclusive with representing an organization).
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: NPWP already registered to another organization, or the user already represents 5 organization as owner.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"
              examples:
                npwp_taken:
                  value:
                    type: "https://kencleng.dev/errors/npwp-taken"
                    title: "NPWP Already Registered"
                    status: 409
                    detail: "NPWP ini sudah terdaftar di organisasi lain."
                org_limit:
                  value:
                    type: "https://kencleng.dev/errors/organization-limit-reached"
                    title: "Organization Limit Reached"
                    status: 409
                    detail: "Anda sudah menjadi owner di 5 organisasi, batas maksimum tercapai."

  /organizations/{organizationId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [organization]
      summary: Get organization detail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

    patch:
      tags: [organization]
      summary: Update organization fields
      description: >
        Updating `name` or `npwp` (legal/identitas class) requires
        `confirm: true` and sends `status` back to `pending_verification`,
        opening a new curation cycle. `description`/`contact` (operasional
        class) never require confirmation and never change `status`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdateRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "422":
          $ref: "./common.yaml#/components/responses/ValidationError"
        "403":
          description: Current user is not a representative of this organization.
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: "`name`/`npwp` changed without `confirm: true`, or NPWP already taken."
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"
              example:
                type: "https://kencleng.dev/errors/confirmation-required"
                title: "Confirmation Required"
                status: 409
                detail: "Mengubah field legal/identitas memerlukan konfirmasi eksplisit (confirm=true)."

  /organizations/{organizationId}/attachments:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [organization]
      summary: List legal document attachments
      description: Returns metadata only — use the signed-URL endpoint to actually view/download a file.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationAttachment"
        "403":
          description: >
            Only Owner-level representatives, or Admin/Kurator, may list
            legal documents (per kencleng-phase0-detail.md Fitur 7 — legal
            docs restricted to `owner`, not `staff`).
          $ref: "./common.yaml#/components/responses/Forbidden"

  /organizations/{organizationId}/attachments/{type}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AttachmentType"
    put:
      tags: [organization]
      summary: Upload or replace a legal document
      description: >
        Replacing `akta_notaris` or `sk_kemenkumham` triggers re-curation
        (same as editing `name`/`npwp`) and requires `confirm=true`.
        Replacing `izin_pub` does not.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReplaceAttachmentRequest"
      responses:
        "200":
          description: Uploaded/replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationAttachment"
        "422":
          description: Invalid file type or exceeds 5 MB max.
          $ref: "./common.yaml#/components/responses/ValidationError"
        "403":
          description: Only `owner`-level representatives may manage legal documents.
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: Legal-document replacement submitted without `confirm=true`.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

    get:
      tags: [organization]
      summary: Get a signed download URL for a legal document
      responses:
        "200":
          description: OK — `download_url` valid for 5 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationAttachment"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /organizations/{organizationId}/representatives:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [organization]
      summary: List representatives
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Representative"

    post:
      tags: [organization]
      summary: Invite a representative (direct-add, no consent step)
      description: >
        Adds `level = staff` immediately. Fails if the email doesn't
        belong to a registered, email-verified user, or is already a
        representative of this organization. Owner-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRepresentativeRequest"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Representative"
        "403":
          description: Current user is not an `owner`-level representative of this organization.
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: No registered, email-verified user found for that email.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"
              example:
                type: "https://kencleng.dev/errors/user-not-found"
                title: "User Not Found"
                status: 404
                detail: "User harus terdaftar & email terverifikasi dulu."
        "409":
          description: Already a representative of this organization.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /organizations/{organizationId}/representatives/{representativeId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: representativeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [organization]
      summary: Promote (staff → owner) or demote (owner → staff) a representative
      description: >
        Demoting the last remaining `owner` is rejected (409) — an
        organization must always retain at least one owner. Owner-only,
        including for self-demote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepresentativeLevelRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Representative"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: Would leave the organization with 0 owners.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"
              example:
                type: "https://kencleng.dev/errors/last-owner"
                title: "Cannot Demote Last Owner"
                status: 409
                detail: "Organisasi harus memiliki minimal satu owner."

    delete:
      tags: [organization]
      summary: Remove a representative
      description: >
        Removing the last remaining `owner` is rejected (409), same guard
        as demote. Owner-only, including for self-remove.
      responses:
        "204":
          description: Removed.
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: Would leave the organization with 0 owners.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /organizations/curation-queue:
    get:
      tags: [organization]
      summary: List organization awaiting curator assignment (Admin only)
      description: Organization with `status = pending_verification` and no active (`decision = pending`) assignment yet.
      parameters:
        - $ref: "./common.yaml#/components/parameters/CursorParam"
        - $ref: "./common.yaml#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /organizations/{organizationId}/curation/assign:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [organization]
      summary: Assign a Kurator to review this organization (Admin only)
      description: >
        Fails if the chosen kurator is a representative of this
        organization (conflict of interest), or if an assignment with
        `decision = pending` already exists for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCuratorRequest"
      responses:
        "201":
          description: Assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationCurationAssignment"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: Conflict of interest, or an active assignment already exists.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"
              examples:
                conflict_of_interest:
                  value:
                    type: "https://kencleng.dev/errors/curator-conflict-of-interest"
                    title: "Conflict Of Interest"
                    status: 409
                    detail: "Kurator ini adalah representative organisasi ini."
                already_assigned:
                  value:
                    type: "https://kencleng.dev/errors/assignment-already-active"
                    title: "Assignment Already Active"
                    status: 409
                    detail: "Sudah ada assignment aktif untuk organisasi ini."

  /organizations/curation-assignments/mine:
    get:
      tags: [organization]
      summary: List the current Kurator's assigned organization curation items
      parameters:
        - name: decision
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CurationDecision"
          description: Filter by decision status. Omit to return all.
        - $ref: "./common.yaml#/components/parameters/CursorParam"
        - $ref: "./common.yaml#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationCurationAssignmentListResponse"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /organizations/{organizationId}/curation/decision:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [organization]
      summary: Submit a curation decision (approve/reject) — assigned Kurator only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurationDecisionRequest"
      responses:
        "200":
          description: Decision recorded. `Organization.status` updated to `verified` or `rejected`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "422":
          description: "`decision_note` missing while `decision = rejected`."
          $ref: "./common.yaml#/components/responses/ValidationError"
        "403":
          description: Current user is not the Kurator assigned to this organization's active curation assignment.
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: No active (`pending`) assignment exists for this organization.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"


components:
  schemas:
    # Organization domain schemas
    # ---------------------------------------------------------------------
    OrganizationStatus:
      type: string
      enum: [pending_verification, verified, rejected]

    RepresentativeLevel:
      type: string
      enum: [owner, staff]

    AttachmentType:
      type: string
      enum: [akta_notaris, sk_kemenkumham, izin_pub]

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
        npwp:
          type: string
          description: >
            Decrypted value, as far as the API is concerned. PII masking
            (including for the organization's own Owner viewing their own
            NPWP) is enforced on the frontend via `MaskedField`, per
            kencleng-actors-entities.md — the API does not mask this itself.
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        has_overdue_report:
          type: boolean
        my_level:
          $ref: "#/components/schemas/RepresentativeLevel"
          description: The requesting user's representative level on this organization, if any.
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationListItem:
      allOf:
        - $ref: "#/components/schemas/Organization"

    OrganizationListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationListItem"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    OrganizationCreateRequest:
      type: object
      description: >
        # INFERRED — multipart/form-data, since creation requires legal
        document files in the same submission (Fitur 1 flow submits
        everything at once, no separate draft-then-attach step for a
        brand-new organization).
      required: [name, npwp, akta_notaris, sk_kemenkumham]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        contact:
          type: string
        npwp:
          type: string
          description: "Format `XX.XXX.XXX.X-XXX.XXX` — format-only validation, no DJP lookup."
          pattern: '^\d{2}\.\d{3}\.\d{3}\.\d-\d{3}\.\d{3}$'
        akta_notaris:
          type: string
          format: binary
        sk_kemenkumham:
          type: string
          format: binary
        izin_pub:
          type: string
          format: binary
          description: Optional in v1.

    OrganizationUpdateRequest:
      type: object
      description: >
        Partial update. Updating any "legal/identitas" field (`name`,
        `npwp`) sends `Organization.status` back to `pending_verification`
        and requires `confirm: true` in the same request — mirroring the
        FE confirmation dialog described in Fitur 1. `description` and
        `contact` ("operasional" fields) never affect status and never
        require confirmation.
        # INFERRED — the confirm-flag contract itself isn't specified in
        the phase doc (only the FE dialog UX is); this is the proposed
        API-level mechanism.
      properties:
        name:
          type: string
        npwp:
          type: string
          pattern: '^\d{2}\.\d{3}\.\d{3}\.\d-\d{3}\.\d{3}$'
        description:
          type: string
        contact:
          type: string
        confirm:
          type: boolean
          description: Required (`true`) if this request changes `name` or `npwp`.

    OrganizationAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/AttachmentType"
        original_name:
          type: string
        size_bytes:
          type: integer
        content_type:
          type: string
        uploaded_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        download_url:
          type: string
          description: >
            Signed URL, 5-minute expiry per kencleng-backend-tech-stack.md.
            Only present when fetched via the signed-URL endpoint, not on
            plain attachment listing.

    ReplaceAttachmentRequest:
      type: object
      description: >
        multipart/form-data. Replacing `akta_notaris` or `sk_kemenkumham`
        (legal/identitas class) triggers re-curation exactly like editing
        `name`/`npwp` — also requires `confirm=true` as a form field.
        Replacing `izin_pub` does not.
      required: [file]
      properties:
        file:
          type: string
          format: binary
        confirm:
          type: boolean

    Representative:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        level:
          $ref: "#/components/schemas/RepresentativeLevel"
        created_at:
          type: string
          format: date-time

    InviteRepresentativeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Must belong to an existing, email-verified user.

    UpdateRepresentativeLevelRequest:
      type: object
      required: [level]
      properties:
        level:
          $ref: "#/components/schemas/RepresentativeLevel"

    CurationDecision:
      type: string
      enum: [pending, approved, rejected]

    OrganizationCurationAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        kurator_id:
          type: string
          format: uuid
        assigned_by:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time
        decision:
          $ref: "#/components/schemas/CurationDecision"
        decision_note:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true

    OrganizationCurationAssignmentListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationCurationAssignment"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    AssignCuratorRequest:
      type: object
      required: [kurator_id]
      properties:
        kurator_id:
          type: string
          format: uuid

    CurationDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        decision_note:
          type: string
          description: Required if `decision` is `rejected`.

    # ---------------------------------------------------------------------
