root = "."
tmp_dir = "tmp"
# The backend loads .env on each start; do not freeze its values in Air's parent.
env_files = []

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = ["./tmp/server"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum", ".env"]
exclude_dir = ["bin", "tmp", "vendor", ".git"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "6s"

[misc]
clean_on_exit = true
